services:
  # ---------------------------------------------------------------------------
  # Backend — FastAPI on a Render Web Service, backed by Render PostgreSQL.
  # ---------------------------------------------------------------------------
  - type: web
    name: flowguard-api
    runtime: python
    rootDir: backend
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.0
      # Render PostgreSQL (PRD §17/§18 + acceptance criterion 11 REQUIRE a managed
      # Postgres; SQLite remains the zero-setup local-dev fallback in database.py).
      # If this account's single free database is already in use, either upgrade
      # or temporarily switch this value to sqlite:///./flowguard.db — but note the
      # demo will then lose persistence across deploys/restarts (ephemeral disk).
      - key: DATABASE_URL
        fromDatabase:
          name: flowguard-db
          property: connectionString
      # Auto-wired to the static site's public URL — no manual dashboard step.
      - key: CORS_ORIGINS
        fromService:
          type: web
          name: flowguard-web
          envVarKey: RENDER_EXTERNAL_URL
      - key: ENV
        value: production

  # ---------------------------------------------------------------------------
  # Frontend — Vite build served as a Render Static Site
  # ---------------------------------------------------------------------------
  - type: web
    name: flowguard-web
    runtime: static
    rootDir: frontend
    # NOTE: do NOT add `plan` here. Render's blueprint schema defines a static
    # site as `type: web` + `runtime: static` with additionalProperties: false and
    # NO `plan` property — static sites are always free. Adding `plan: free` fails
    # with: "services[1].plan — no such plan free for service type web".
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    envVars:
      - key: NODE_VERSION
        value: 22.11.0
      # Vite inlines this at BUILD time. Auto-wired to the API's public URL.
      # Manual fallback: https://<flowguard-api>.onrender.com
      - key: VITE_API_URL
        fromService:
          type: web
          name: flowguard-api
          envVarKey: RENDER_EXTERNAL_URL
    # REQUIRED: this is a single-page app (React Router). Without the rewrite,
    # deep links and refreshes on /login, /ops, /verify/:txnId and /cases/:id
    # return 404 from the static host.
    routes:
      - type: rewrite
        source: /*
        destination: /index.html

databases:
  - name: flowguard-db
    plan: free
